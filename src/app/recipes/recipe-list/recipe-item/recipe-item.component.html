<a class="recipe-card"
    [routerLink]="[index]"
    routerLinkActive="active">
    <img class="recipe-card__img"
        [src]="recipe.imagePath"
        alt="{{ recipe.name }}">
    <div class="recipe-card__body">
        <h4 class="recipe-card__title">{{ recipe.name }}</h4>
        <p class="recipe-card__desc">{{ recipe.description }}</p>
    </div>
</a>
